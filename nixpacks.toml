[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_20", "npm-9_x"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "python3 -m venv .venv",
  ".venv/bin/pip install -r backend/requirements.txt",
  "npm install"
]

[phases.build]
dependsOn = ["install"]
cmds = [
  "npm run build"
]

[start]
cmd = ".venv/bin/uvicorn backend.main_supabase:app --host 0.0.0.0 --port $PORT"
