services:
  # Web Service for the Backend (FastAPI)
  - type: web
    name: debate-pal-backend
    env: python
    region: ohio # Close to US East users, adjust if needed
    plan: free # Use Free tier
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main_supabase:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false # User must enter this in Render Dashboard
      - key: SUPABASE_ANON_KEY
        sync: false # User must enter this in Render Dashboard
      - key: PYTHON_VERSION
        value: 3.10.0
